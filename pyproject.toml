[project]
name = "t00my-mcp"
version = "0.1.0"
description = "Unofficial MCP server (FastMCP) for the toom.de DIY shop: search, baskets per market, stock, nearby search, pickup planning. Not affiliated with toom."
readme = "README.md"
license = "AGPL-3.0-or-later"
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=4.1.0",
    "httpx>=0.28.1",
    "tzdata>=2024.1",  # opening hours use Europe/Berlin
]

[project.scripts]
t00my-mcp = "t00my_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/t00my_mcp"]

[dependency-groups]
dev = ["pytest>=9.1.1", "pytest-asyncio>=1.4.0"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["live: talks to the real toom.de (read-only); set TOOMY_LIVE=1"]
